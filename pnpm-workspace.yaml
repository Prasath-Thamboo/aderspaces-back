# Medusa (dashboard admin, CLI) résout react, @medusajs/ui, etc. depuis la
# racine du projet : sans hoisting à plat, `medusa build` échoue sur une
# installation propre (CI, Docker).
shamefullyHoist: true
allowBuilds:
  '@medusajs/telemetry': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true

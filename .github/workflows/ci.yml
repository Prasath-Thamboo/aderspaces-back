name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders : `medusa build` charge medusa-config.ts mais n'ouvre
      # aucune connexion (les migrations sont une étape distincte).
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000
      JWT_SECRET: ci_placeholder_secret_min_32_characters_long
      COOKIE_SECRET: ci_placeholder_secret_min_32_characters_long
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm run lint

      - name: Tests unitaires
        run: pnpm run test

      - name: Build
        run: pnpm run build
